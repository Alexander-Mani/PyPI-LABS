# benign_samples.yaml — Control group manifest for supply chain detection benchmarking.
#
# Each entry defines a consecutive version pair (v_before -> v_after) from real PyPI.
# Samples are grouped by the attack vector they serve as the benign counterpart to.
# The analyzer compares versions[-2] -> versions[-1], so upload order matters:
# pull_benign.py downloads v_before first, v_after second.

samples:

  # --- Typosquatting counterparts ---
  # These are the legitimate originals that attackers commonly squat on.
  # Benign control: do consecutive minor bumps flag as malicious?
  typosquatting:
    - package: colorama       # direct target of colorizr-style squats
      versions: ["0.4.4", "0.4.5"]
    - package: requests       # most squatted package on PyPI
      versions: ["2.28.2", "2.29.0"]
    - package: urllib3        # frequently targeted, large install base
      versions: ["1.26.14", "1.26.15"]
    - package: pillow         # squatted via PIL, Pillow, pillow
      versions: ["9.5.0", "10.0.0"]

  # --- Dependency confusion counterparts ---
  # Infrastructure/build packages with clean, boring version bumps.
  # Benign control: do minor version increments in build tools trigger alerts?
  dependency_confusion:
    - package: setuptools     # frequently targeted by dep-confusion attacks
      versions: ["67.8.0", "68.0.0"]
    - package: wheel          # packaging infrastructure, minimal diffs
      versions: ["0.40.0", "0.41.0"]
    - package: packaging      # PEP 508 parser, very small codebase
      versions: ["23.1", "23.2"]

  # --- Credential takeover counterparts ---
  # Well-audited packages with documented, routine version bumps.
  # Benign control: does adding a legitimate bug fix trigger a false positive?
  credential_takeover:
    - package: flask          # small maintainer team, clean commit history
      versions: ["2.3.2", "2.3.3"]
    - package: click          # same maintainer as Flask, stable API
      versions: ["8.1.6", "8.1.7"]
    - package: pydantic       # stable 1.x branch, very predictable diffs
      versions: ["1.10.12", "1.10.13"]

  # --- Silent injection counterparts ---
  # Packages that touch __init__.py or setup hooks on version bump but do nothing malicious.
  # Benign control: does a legitimate change to import-time code trigger an alert?
  silent_injection:
    - package: loguru         # modifies __init__ on minor bumps, no install hooks
      versions: ["0.7.0", "0.7.1"]
    - package: rich           # frequent minor releases, clean diffs
      versions: ["13.5.3", "13.6.0"]
    - package: pyyaml         # minimal diff between 6.0 and 6.0.1
      versions: ["6.0", "6.0.1"]
