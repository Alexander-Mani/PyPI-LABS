server:
  host: "127.0.0.1"
  port: 9090
  debug: false

# Providers the proxy will forward requests for.
# Requests for any other provider are rejected with HTTP 400.
allowed_providers:
  - anthropic
  - openai
  - gemini

# Maximum allowed request payload size in bytes (64 KB).
# Requests exceeding this are rejected with HTTP 413 to prevent
# malicious packages from using the proxy as a relay for large exfiltration.
max_payload_bytes: 65536

logging:
  file: "logs/proxy.log"
  level: "INFO"
  console_output: true
