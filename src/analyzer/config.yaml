simulator:
  base_url: "http://127.0.0.1:8080"

# Credential proxy — routes all LLM API calls through an isolated service that
# holds the API keys. The analyzer process itself carries no keys in proxy mode.
# Set url to null or omit to fall back to direct SDK calls (local dev only).
credential_proxy:
  url: "http://127.0.0.1:9090"

detection:
  # Which detectors to run (can be combined)
  static_tools:
    - "bandit"
    - "semgrep"
  llm_providers:
    - "anthropic"   # set API key via env: ANTHROPIC_API_KEY
    # - "openai"    # OPENAI_API_KEY
    # - "gemini"    # GEMINI_API_KEY
    # - "deepseek"  # DEEPSEEK_API_KEY
    # - "mistral"   # MISTRAL_API_KEY
    # - "meta"      # META_API_KEY

  # Prompt/config store path (system prompts for LLM detectors)
  prompt_store: "prompts/"

storage:
  results_db: "data/results.db"

logging:
  file: "logs/analyzer.log"
  level: "INFO"
  console_output: true
