simulator:
  base_url: "http://127.0.0.1:8080"

# Credential proxy — legacy diff-pipeline config reference.
# The active evaluate.py pipeline reads proxy_url from each configs/*.yaml model file.
# This section is retained for logging setup context and operator reference only.
credential_proxy:
  url: "http://127.0.0.1:4000"

detection:
  # Which detectors to run (can be combined)
  static_tools:
    - "bandit"
    - "semgrep"
  llm_providers:
    - "anthropic"   # set API key via env: ANTHROPIC_API_KEY
    # - "openai"    # OPENAI_API_KEY
    # - "gemini"    # GEMINI_API_KEY
    # - "deepseek"  # DEEPSEEK_API_KEY
    # - "mistral"   # MISTRAL_API_KEY
    # - "meta"      # META_API_KEY

  # Prompt/config store path (system prompts for LLM detectors)
  prompt_store: "prompts/"

storage:
  results_db: "data/results.db"

logging:
  file: "logs/analyzer.log"
  level: "INFO"
  console_output: true
