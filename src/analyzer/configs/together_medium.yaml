model_name: "together_ai/meta-llama/Llama-3.3-70B-Instruct-Turbo"
tier: "medium"
temperature: 0.0
max_tokens: 8192
proxy_url: "http://127.0.0.1:4000"
retry_attempts: 1
retry_delay_seconds: 5
retry_transport_categories:
  - "rate_limit"
  - "provider_overload"
response_format:
  type: "json_schema"
  json_schema:
    name: "supply_chain_verdict"
    schema:
      type: "object"
      additionalProperties: false
      required:
        - "verdict"
        - "confidence"
        - "reasoning"
      properties:
        verdict:
          type: "string"
          enum:
            - "malicious"
            - "benign"
        confidence:
          type: "number"
        reasoning:
          type: "string"
fallback_models:
  - "together_ai/deepseek-ai/DeepSeek-V3.1"
  - "together_ai/MiniMaxAI/MiniMax-M2.5"
