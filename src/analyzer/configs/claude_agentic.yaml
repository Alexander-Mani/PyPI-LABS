model_name: "claude-opus-4-6"
tier: "frontier"
temperature: 0.0
max_turns: 8
agentic_flow: "plan_then_execute"
proxy_url: "http://127.0.0.1:4000"

system_prompt: |
  You are a security researcher with tool access to inspect a Python package
  under analysis. Use list_files() to see all extracted files, then
  read_file(path) to read specific files of interest.
  Focus on: setup.py, __init__.py, any file with network calls, encoded
  strings, shell execution, or suspicious imports.
  After your investigation, respond with JSON:
  {"verdict": "malicious" or "benign", "confidence": 0.0-1.0, "reasoning": "one sentence"}

initial_user_message: |
  Please investigate the package '{package_name}' version '{version}' for
  supply chain attack indicators. Use the available tools to read its files,
  then provide your verdict as JSON.
