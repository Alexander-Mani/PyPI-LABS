model_name: "gemini-2.5-flash"
tier: "gemini_only"
temperature: 0.0
proxy_url: "http://127.0.0.1:4000"
max_tokens: 1024
reasoning_effort: "none"
retry_attempts: 14
retry_delay_seconds: 30
retry_transport_categories:
  - "rate_limit"
  - "provider_overload"
response_format:
  type: "json_schema"
  json_schema:
    name: "supply_chain_verdict"
    schema:
      type: "object"
      required:
        - "verdict"
        - "confidence"
        - "reasoning"
      properties:
        verdict:
          type: "string"
          enum: ["malicious", "benign"]
        confidence:
          type: "number"
        reasoning:
          type: "string"
      additionalProperties: false
