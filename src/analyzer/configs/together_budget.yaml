model_name: "together_ai/Qwen/Qwen3.5-9B"
tier: "budget"
temperature: 0.0
max_tokens: 8192
proxy_url: "http://127.0.0.1:4000"
retry_attempts: 1
retry_delay_seconds: 5
retry_transport_categories:
  - "rate_limit"
  - "provider_overload"
response_format:
  type: "json_schema"
  json_schema:
    name: "supply_chain_verdict"
    schema:
      type: "object"
      additionalProperties: false
      required:
        - "verdict"
        - "confidence"
        - "reasoning"
      properties:
        verdict:
          type: "string"
          enum:
            - "malicious"
            - "benign"
        confidence:
          type: "number"
        reasoning:
          type: "string"
fallback_models:
  - "together_ai/meta-llama/Meta-Llama-3-8B-Instruct-Lite"
  - "together_ai/Qwen/Qwen2.5-7B-Instruct-Turbo"
