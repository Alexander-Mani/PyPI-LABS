# Analyzer model profiles for reproducible evaluation runs.
# Entries are src/analyzer/configs/*.yaml stems. Static SAST detectors always run.
profiles:
  budget:
    tier: budget
    configs:
      - claude_haiku
      - gpt_nano
      - gemini_flash_lite
      - together_budget
      - claude_haiku_agentic

  budget_no_gemini:
    tier: budget
    configs:
      - claude_haiku
      - gpt_nano
      - together_budget
      - claude_haiku_agentic

  medium:
    tier: medium
    configs:
      - claude_sonnet
      - gpt_mini
      - gemini_flash
      - together_medium
      - claude_sonnet_agentic

  frontier:
    tier: frontier
    configs:
      - claude_opus
      - gpt
      - gemini
      - together_frontier
      - claude_agentic

  all_models:
    tier: frontier
    configs:
      - claude_haiku
      - gpt_nano
      - gemini_flash_lite
      - together_budget
      - claude_haiku_agentic
      - claude_sonnet
      - gpt_mini
      - gemini_flash
      - together_medium
      - claude_sonnet_agentic
      - claude_opus
      - gpt
      - gemini
      - together_frontier
      - claude_agentic

  gemini_only:
    tier: frontier
    configs:
      - gemini_resilient_flash
      - gemini_resilient_pro

  gemini_only_test:
    tier: frontier
    configs:
      - gemini_resilient_flash
      - gemini_resilient_pro
    resolver:
      include_controls: true
      package_limits:
        malicious: 2
        control: 2
        benign: 0

  frontier_together_bakeoff:
    tier: frontier
    configs:
      - together_frontier_kimi_bench
      - together_frontier_glm51_bench
      - together_frontier_qwen397b_bench
      - together_frontier_minimax25_bench
    resolver:
      include_controls: true
      package_limits:
        malicious: 2
        control: 2
        benign: 0

  test:
    tier: budget
    configs:
      - claude_haiku
      - gpt_nano
      - gemini_flash_lite
      - together_budget
      - claude_haiku_agentic
    resolver:
      include_controls: true
      package_limits:
        malicious: 2
        control: 2
        benign: 0

  test_no_gemini:
    tier: budget
    configs:
      - claude_haiku
      - gpt_nano
      - together_budget
      - claude_haiku_agentic
    resolver:
      include_controls: true
      package_limits:
        malicious: 2
        control: 2
        benign: 0
