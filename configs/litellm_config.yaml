# LiteLLM proxy configuration for PyPi-SCADA.
# Maps bare model names used in src/analyzer/configs/*.yaml to provider routes.
# Deploy to /home/proxy-runner/litellm_config.yaml on the VM.
# Start with: litellm --config litellm_config.yaml --port 4000

model_list:

  # --- Budget tier ---
  - model_name: claude-haiku-4-5
    litellm_params:
      model: anthropic/claude-haiku-4-5

  - model_name: gpt-5.4-nano
    litellm_params:
      model: openai/gpt-5.4-nano

  - model_name: gemini-2.5-flash-lite
    litellm_params:
      model: gemini/gemini-2.5-flash-lite

  # together_ai/* names pass through as-is; listed for health check visibility
  - model_name: together_ai/Qwen/Qwen3.5-9B
    litellm_params:
      model: together_ai/Qwen/Qwen3.5-9B

  - model_name: together_ai/meta-llama/Meta-Llama-3-8B-Instruct-Lite
    litellm_params:
      model: together_ai/meta-llama/Meta-Llama-3-8B-Instruct-Lite

  - model_name: together_ai/Qwen/Qwen2.5-7B-Instruct-Turbo
    litellm_params:
      model: together_ai/Qwen/Qwen2.5-7B-Instruct-Turbo

  # --- Medium tier ---
  - model_name: claude-sonnet-4-6
    litellm_params:
      model: anthropic/claude-sonnet-4-6

  - model_name: gpt-5.4-mini
    litellm_params:
      model: openai/gpt-5.4-mini

  - model_name: gemini-2.5-flash
    litellm_params:
      model: gemini/gemini-2.5-flash

  - model_name: together_ai/meta-llama/Llama-3.3-70B-Instruct-Turbo
    litellm_params:
      model: together_ai/meta-llama/Llama-3.3-70B-Instruct-Turbo

  - model_name: together_ai/deepseek-ai/DeepSeek-V3.1
    litellm_params:
      model: together_ai/deepseek-ai/DeepSeek-V3.1

  - model_name: together_ai/MiniMaxAI/MiniMax-M2.5
    litellm_params:
      model: together_ai/MiniMaxAI/MiniMax-M2.5

  # --- Frontier tier ---
  - model_name: claude-opus-4-6
    litellm_params:
      model: anthropic/claude-opus-4-6

  - model_name: gpt-5.4
    litellm_params:
      model: openai/gpt-5.4

  - model_name: gemini-2.5-pro
    litellm_params:
      model: gemini/gemini-2.5-pro

  - model_name: together_ai/moonshotai/Kimi-K2.5
    litellm_params:
      model: together_ai/moonshotai/Kimi-K2.5

  - model_name: together_ai/zai-org/GLM-5.1
    litellm_params:
      model: together_ai/zai-org/GLM-5.1

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  allowed_fails: 1
  cooldown_time: 30
  fallbacks:
    - {"together_ai/Qwen/Qwen3.5-9B": ["together_ai/meta-llama/Meta-Llama-3-8B-Instruct-Lite", "together_ai/Qwen/Qwen2.5-7B-Instruct-Turbo"]}
    - {"together_ai/meta-llama/Llama-3.3-70B-Instruct-Turbo": ["together_ai/deepseek-ai/DeepSeek-V3.1", "together_ai/MiniMaxAI/MiniMax-M2.5"]}
    - {"together_ai/moonshotai/Kimi-K2.5": ["together_ai/zai-org/GLM-5.1"]}

litellm_settings:
  drop_params: true
